<p-card header="Categorías" subheader="Gestiona las categorías disponibles.">

  <!-- Inline messages removed; toasts handle feedback -->

  <form class="row-add" (ngSubmit)="add()">
    <input pInputText type="text" [formControl]="newCatCtrl" placeholder="Nueva categoría" />
    <button pButton type="submit" label="Añadir" icon="pi pi-plus" [disabled]="newCatCtrl.invalid"></button>
  </form>
  @if (newCatCtrl.touched && newCatCtrl.invalid) {
    <small class="error">Nombre requerido (máx. 40).</small>
  }

  <ul class="list">
    <li *ngFor="let cat of categories()">
      @if (editing() !== cat) {
        <span class="name">{{ cat }}</span>
        <div class="actions">
          <button pButton [text]="true" type="button" icon="pi pi-pencil" (click)="startEdit(cat)"></button>
          <button pButton [text]="true" type="button" icon="pi pi-trash" severity="danger" (click)="remove(cat)"></button>
        </div>
      } @else {
        <input pInputText type="text" [formControl]="editCtrl" />
        <div class="actions">
          <button pButton [text]="true" type="button" icon="pi pi-check" (click)="saveEdit()" [disabled]="editCtrl.invalid"></button>
          <button pButton [text]="true" type="button" icon="pi pi-times" (click)="cancelEdit()"></button>
        </div>
      }
    </li>
  </ul>
</p-card>
